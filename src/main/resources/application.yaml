spring:
  application:
    name: horadoprato
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: false
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
