services:
  # Serviço do Banco de Dados
  db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: meu_banco
      MYSQL_USER: java_user
      MYSQL_PASSWORD: javapassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - rede_comunicacao

  # Serviço da Aplicação Java
  app:
    build: .
    container_name: java_container
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:mysql://db:3306/meu_banco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USER=java_user
      - DB_PASSWORD=javapassword
    networks:
      - rede_comunicacao

# Volumes para não perder os dados do banco ao desligar
volumes:
  mysql_data:

# Rede que interliga os dois containers
networks:
  rede_comunicacao:
    driver: bridge
